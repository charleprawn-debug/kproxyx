name: Verify and Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/adb-persistent-broadcast-bridge
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api-smoke:
    name: KProxyX API smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Verify API health
        run: curl --fail --silent --show-error https://api.kun.publicvm.com:10059/api/health
      - name: Verify API health again
        run: curl --fail --silent --show-error https://api.kun.publicvm.com:10059/api/health
      - name: Check products endpoint
        continue-on-error: true
        run: curl --fail --silent --show-error https://api.kun.publicvm.com:10059/api/v1/products

  backend:
    name: Backend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  android:
    name: Android lint, tests, and debug APK
    needs: [api-smoke, backend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache-dependency-path: android/datapath/go.sum
      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
      - name: Install Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-35" "platforms;android-37.2" "build-tools;35.0.0" "build-tools;37.0.0" "ndk;27.0.12077973"
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
      - name: Test datapath
        run: cd datapath && go test ./...
      - name: Configure API endpoint
        run: echo "API_BASE_URL=${{ vars.API_BASE_URL || 'https://api.kun.publicvm.com:10059/api/v1' }}" >> gradle.properties
      - run: chmod +x gradlew
      - name: Build debug APK with dependency retries
        run: |
          for attempt in 1 2 3; do
            ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --no-daemon && exit 0
            echo "Android dependency/build attempt ${attempt} failed; retrying after 15 seconds..."
            sleep 15
          done
          exit 1
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: proxy-platform-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Prepare release keystore
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.KUNCLOAK_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > kuncloak-release.jks
          chmod 600 kuncloak-release.jks
          {
            echo "RELEASE_STORE_FILE=$GITHUB_WORKSPACE/android/kuncloak-release.jks"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KUNCLOAK_RELEASE_STORE_PASSWORD }}"
            echo "RELEASE_KEY_ALIAS=${{ secrets.KUNCLOAK_RELEASE_KEY_ALIAS }}"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KUNCLOAK_RELEASE_KEY_PASSWORD }}"
          } >> gradle.properties
      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: kuncloak-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
