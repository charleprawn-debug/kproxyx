name: Embedded Shizuku device tests

on:
  workflow_dispatch:
  push:
    branches: [feat/embedded-shizuku-server]
  pull_request:
    branches: [feat/embedded-shizuku-server]

permissions:
  contents: read

jobs:
  binder-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the embedded server without installing Shizuku
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          working-directory: android
          script: |
            set +e
            timeout 360s bash ./gradlew :shizuku-server:connectedDebugAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.timeout_msec=90000
            RESULT=$?
            adb logcat -d -v brief -s KProxyXShizukuTest:I KProxyXShizuku:V TestRunner:I AndroidRuntime:E ShizukuServiceStarter:E '*:S' | sed -E 's/[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}(-[0-9]+)?/[redacted]/g'
            exit $RESULT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-shizuku-device-results-${{ matrix.api }}
          path: android/shizuku-server/build/reports/androidTests/
