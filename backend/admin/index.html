<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#172033;background:#f5f7fb;--primary:#315efb;--primary-dark:#2348cf;--ink:#172033;--muted:#718096;--line:#e5eaf2;--success:#15805a;--danger:#c24141;--warning:#b7791f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#f6f8fc 0%,#eef3ff 100%)}button,input,select,textarea{font:inherit}.shell{max-width:1280px;margin:auto;padding:28px 20px}.login{max-width:430px;margin:10vh auto}.panel,.stat{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 35px #263b5b0b}.panel{padding:24px}.brand{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:24px}.brand h1{margin:0;font-size:29px;letter-spacing:-.5px}.brand p{margin:6px 0 0}.muted{color:var(--muted)}.hidden{display:none!important}.input,.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid #d8e0ec;border-radius:12px;background:#fff;color:var(--ink);outline:none;margin-top:6px}.input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px #315efb18}.field textarea{min-height:90px;resize:vertical}.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--primary);color:#fff;font-weight:750;cursor:pointer;transition:.18s}.btn:hover{background:var(--primary-dark);transform:translateY(-1px)}.btn.secondary{background:#edf2ff;color:var(--primary)}.btn.ghost{background:#f5f7fb;color:#4b5a70}.btn.danger{background:#fff0f0;color:var(--danger)}.btn.small{padding:8px 11px;font-size:13px}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}.error{color:var(--danger);min-height:22px;margin:10px 0}.hero{padding:25px;border-radius:22px;background:linear-gradient(120deg,#152a65,#315efb 60%,#26b9d4);color:#fff;margin-bottom:22px;box-shadow:0 18px 40px #315efb2b}.hero h2{margin:0;font-size:22px}.hero p{margin:8px 0 0;color:#dbe8ff}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}.stat{padding:18px}.stat .icon{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#edf2ff;color:var(--primary);font-weight:800}.stat b{display:block;font-size:27px;margin-top:13px}.stat span{font-size:13px;color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.tabs button{border:1px solid var(--line);background:#f7f9fc;color:#56647a;padding:11px 16px;border-radius:12px;cursor:pointer;font-weight:700}.tabs button.active{background:var(--primary);border-color:var(--primary);color:#fff}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.toolbar h2{margin:0;font-size:21px}.toolbar-actions{display:flex;gap:8px;flex-wrap:wrap}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:780px}th,td{text-align:right;padding:14px 10px;border-bottom:1px solid #edf1f6;vertical-align:middle}th{font-size:12px;color:#718096;font-weight:800}td{font-size:14px}.actions{display:flex;gap:6px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;background:#e8f7ef;color:var(--success);font-size:12px;font-weight:750}.pill.off{background:#f2f4f7;color:#718096}.pill.warn{background:#fff7e6;color:var(--warning)}.user-name{font-weight:800}.user-email{font-size:12px;color:var(--muted);direction:ltr;text-align:right}.empty{text-align:center;padding:42px 15px;color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:block;font-size:13px;color:#66758b;font-weight:700}.field.full{grid-column:1/-1}.check-row{display:flex;gap:10px;flex-wrap:wrap}.check{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:13px;padding:11px 13px;background:#fafbfe;cursor:pointer;color:#3c4c65}.check.selected{border-color:#9eb2ff;background:#eef2ff;color:#2348cf}.check input{accent-color:var(--primary);width:17px;height:17px}.modal-backdrop{position:fixed;inset:0;background:#17203380;display:grid;place-items:center;padding:18px;z-index:10}.modal{background:#fff;width:min(650px,100%);max-height:90vh;overflow:auto;border-radius:24px;box-shadow:0 24px 80px #17203340}.modal-head{display:flex;align-items:flex-start;justify-content:space-between;padding:22px 24px;border-bottom:1px solid var(--line)}.modal-head h3{margin:0;font-size:21px}.modal-body{padding:24px}.modal-foot{display:flex;justify-content:flex-start;gap:9px;padding:18px 24px;border-top:1px solid var(--line)}.close{border:0;background:#f3f5f8;color:#718096;border-radius:10px;width:34px;height:34px;cursor:pointer;font-size:20px}.section-note{padding:13px 15px;border-radius:13px;background:#f7f9fc;color:#64748b;font-size:13px;margin-bottom:17px}.sub-list{display:grid;gap:8px;margin-top:10px}.sub-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:11px 13px}.toast{position:fixed;bottom:22px;left:22px;background:#172033;color:white;padding:13px 17px;border-radius:12px;box-shadow:0 12px 30px #17203340;z-index:20}.toast.error{background:#c24141;color:#fff}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:640px){.shell{padding:18px 12px}.brand{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar{align-items:flex-start;flex-direction:column}.modal-foot{flex-wrap:wrap}}
</style></head>
<body>
<main id="login" class="shell login panel"><h1>تسجيل الدخول</h1><p class="muted">لوحة الإدارة الآمنة</p><form id="loginForm"><label>البريد الإلكتروني<input id="email" class="input" type="email" required autocomplete="username"></label><label>كلمة المرور<input id="password" class="input" type="password" required autocomplete="current-password"></label><button class="btn" style="width:100%;margin-top:8px" type="submit">دخول آمن</button><p id="loginError" class="error"></p></form></main>
<main id="app" class="shell hidden"><header class="brand"><div><h1>مركز إدارة KUN Proxy</h1><p class="muted">إدارة المستخدمين والاشتراكات والرصيد من مكان واحد</p></div><button id="logout" class="btn secondary">تسجيل الخروج</button></header>
<section class="hero"><h2>نظرة عامة على المنصة</h2><p>تابع الحسابات والاشتراكات وطلبات الشحن واتخذ الإجراءات بسرعة وأمان.</p></section>
<section class="stats" id="stats"></section>
<section class="panel"><nav class="tabs"><button class="active" data-tab="users">المستخدمون</button><button data-tab="subscriptionPlans">خطط الاشتراك</button><button data-tab="topups">طلبات الشحن</button><button data-tab="topupMethods">طرق الشحن</button><button data-tab="landingSettings">صفحة الهبوط</button></nav><div id="users" class="tab"></div><div id="subscriptionPlans" class="tab hidden"></div><div id="topups" class="tab hidden"></div><div id="topupMethods" class="tab hidden"></div><div id="landingSettings" class="tab hidden"></div></section></main>
<div id="modalRoot"></div><div id="toastRoot"></div><script src="/admin/admin.js"></script>
</body></html>
